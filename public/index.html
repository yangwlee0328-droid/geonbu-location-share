<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>건부추노</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="건부추노">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#e6e8ec; --blue:#2563eb; --green:#16a34a; --red:#dc2626; --grey:#c4c8cf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#1a1d23; --text:#eceef1; --muted:#9aa0a8; --line:#2b2f37; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --grey:#4b5058; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  .hidden { display:none !important; }
  button { font:inherit; cursor:pointer; border:0; }
  .big { width:100%; padding:17px; border-radius:16px; font-size:17px; font-weight:700; background:var(--blue); color:#fff; }
  .big.stop { background:var(--card); color:var(--red); border:2px solid var(--red); }
  .link { background:none; color:var(--muted); font-size:14px; padding:10px; text-decoration:underline; text-underline-offset:3px; }
  input { font:inherit; font-size:17px; width:100%; padding:16px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); color:var(--text); outline:none; }
  input:focus { border-color:var(--blue); }

  /* 시작 화면 */
  #join { min-height:100%; display:flex; flex-direction:column; justify-content:center; max-width:400px; margin:0 auto; padding:32px 20px; gap:14px; }
  #join .logo { font-size:48px; text-align:center; }
  #join h1 { margin:0; text-align:center; font-size:28px; }
  #join .sub { margin:0 0 18px; text-align:center; color:var(--muted); line-height:1.5; }
  #invited { text-align:center; font-weight:600; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .err { color:var(--red); text-align:center; min-height:20px; font-size:14px; }

  /* 메인 화면 */
  #app { position:fixed; inset:0; }
  #map { position:absolute; inset:0; z-index:0; }
  .top { position:absolute; top:max(12px, env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; z-index:500; pointer-events:none; }
  .pill { pointer-events:auto; background:var(--card); color:var(--text); border-radius:999px; padding:10px 16px; font-weight:700; font-size:15px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  .pill.invite { background:var(--blue); color:#fff; }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:500; background:var(--card); border-radius:22px 22px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.12); padding:18px 18px max(14px, env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  .status { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; margin-bottom:14px; }
  .status .dot { width:12px; height:12px; }
  .status small { display:block; font-weight:400; color:var(--muted); font-size:13px; margin-top:2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--grey); flex:none; }
  .dot.on { background:var(--green); box-shadow:0 0 0 4px color-mix(in srgb, var(--green) 25%, transparent); }
  .who { margin-top:16px; font-size:13px; color:var(--muted); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
  .chip { display:flex; align-items:center; gap:7px; white-space:nowrap; padding:9px 13px; border-radius:999px; background:var(--bg); color:var(--text); font-size:14px; border:1px solid var(--line); }
  .chip[disabled] { opacity:.6; cursor:default; }
  .foot { text-align:center; margin-top:4px; }

  /* 선택 창 */
  .modal { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
  .modal .box { background:var(--card); width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:22px 18px max(16px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
  .modal h3 { margin:0; font-size:20px; }
  .modal p { margin:0 0 6px; color:var(--muted); line-height:1.5; font-size:14px; }
  .opt { width:100%; padding:16px; border-radius:14px; font-size:16px; font-weight:600; background:var(--bg); color:var(--text); border:1.5px solid var(--line); }
  .opt:active { border-color:var(--blue); }

  .pin { display:inline-block; background:var(--blue); color:#fff; border-radius:12px; padding:3px 9px; font-size:13px; font-weight:700; white-space:nowrap; border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.35); transform:translate(-50%,-50%); }
  .pin.me { background:var(--green); }
  .toast { position:fixed; left:50%; bottom:50%; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff; padding:10px 16px; border-radius:12px; z-index:10000; font-size:14px; }
</style>
</head>
<body>

<!-- 시작 화면 -->
<section id="join">
  <div class="logo">📍</div>
  <h1>건부추노</h1>
  <p class="sub">내가 켤 때만 친구들에게 내 위치가 보여요</p>
  <div id="invited" class="hidden"></div>
  <input id="name" maxlength="20" placeholder="내 이름" autocomplete="nickname">
  <input id="code" class="hidden" maxlength="6" placeholder="초대 코드 6자리" style="text-transform:uppercase;letter-spacing:3px">
  <button class="big" id="btnMain">새 그룹 만들기</button>
  <button class="link" id="btnSwitch">초대 코드가 있어요</button>
  <div class="err" id="err"></div>
  <div id="ver" style="text-align:center;color:var(--muted);font-size:12px"></div>
</section>

<!-- 메인 화면 -->
<section id="app" class="hidden">
  <div id="map"></div>
  <div class="top">
    <div class="pill" id="gName"></div>
    <button class="pill invite" id="btnInvite">친구 초대</button>
  </div>
  <div class="sheet">
    <div class="status"><span class="dot" id="myDot"></span><div><span id="myStatus"></span><small id="mySub"></small></div></div>
    <button class="big" id="btnToggle"></button>
    <div class="who" id="whoLabel"></div>
    <div class="chips" id="chips"></div>
    <div class="foot"><button class="link" id="btnLeave">그룹 나가기</button></div>
  </div>
</section>

<!-- 공유 시간 선택 = 동의 -->
<div class="modal hidden" id="pick">
  <div class="box">
    <h3>얼마 동안 보여줄까요?</h3>
    <p id="pickInfo"></p>
    <button class="opt" data-min="60">1시간</button>
    <button class="opt" data-min="180">3시간</button>
    <button class="opt" data-min="0">내가 끌 때까지</button>
    <button class="link" id="pickCancel">취소</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
